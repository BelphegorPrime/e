name: Build CLI

on:
  push:
    branches: [master, dev]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Lint, format, typecheck, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux is the gate. macOS and Windows run the same suite to surface
    # portability regressions (paths, sockets, file modes) without blocking a
    # merge yet; flip continue-on-error off once they are consistently green.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Prettier's check compares byte-for-byte; keep LF endings on Windows
      # runners instead of letting git convert them on checkout.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck the UI
        run: npx tsc --noEmit -p ui/tsconfig.json

      - name: Run tests
        run: npm test

      - name: Run build-script tests
        run: npm run test:ui-assets

  build:
    name: Build & package the `e` CLI
    runs-on: ubuntu-latest
    # Packaging six binaries is slow; do it for PRs, tags and manual runs only.
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install ldid
        run: brew install ldid

      # ldid has no --version flag (prints usage and exits 1), so report the
      # installed formula version via brew instead.
      - name: Verify ldid
        run: |
          which ldid
          brew list --versions ldid

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # scripts/generate-version.mjs (run by build:bin) bakes E_VERSION when
      # set; writing src/version.ts here would be overwritten by that step.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "E_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Compiles TypeScript (build:ts) then cross-compiles standalone binaries
      # for all 6 targets into command/ via @yao-pkg/pkg (build:bin).
      - name: Build binaries
        run: npm run build

      # Repackage each raw pkg binary into a per-target archive whose inner
      # file is named `e` (or `e.exe`), so extraction yields the `e` command
      # regardless of the download filename.
      - name: Package binaries
        run: |
          set -euo pipefail
          mkdir -p release
          cd command
          for t in linux-x64 linux-arm64 macos-x64 macos-arm64; do
            cp "e-$t" e
            chmod +x e
            tar -czf "../release/e-$t.tar.gz" e
            rm e
          done
          for t in win-x64 win-arm64; do
            cp "e-$t.exe" e.exe
            zip -j "../release/e-$t.zip" e.exe
            rm e.exe
          done
          ls -la ../release

      - name: Upload e-linux-x64
        uses: actions/upload-artifact@v4
        with:
          name: e-linux-x64
          path: release/e-linux-x64.tar.gz
          if-no-files-found: error

      - name: Upload e-linux-arm64
        uses: actions/upload-artifact@v4
        with:
          name: e-linux-arm64
          path: release/e-linux-arm64.tar.gz
          if-no-files-found: error

      - name: Upload e-macos-x64
        uses: actions/upload-artifact@v4
        with:
          name: e-macos-x64
          path: release/e-macos-x64.tar.gz
          if-no-files-found: error

      - name: Upload e-macos-arm64
        uses: actions/upload-artifact@v4
        with:
          name: e-macos-arm64
          path: release/e-macos-arm64.tar.gz
          if-no-files-found: error

      - name: Upload e-win-x64
        uses: actions/upload-artifact@v4
        with:
          name: e-win-x64
          path: release/e-win-x64.zip
          if-no-files-found: error

      - name: Upload e-win-arm64
        uses: actions/upload-artifact@v4
        with:
          name: e-win-arm64
          path: release/e-win-arm64.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
