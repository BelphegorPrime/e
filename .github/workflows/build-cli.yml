name: Build CLI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & package the `e` CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --workspace @monorepo/cli

      # Compiles TypeScript (build:ts) then cross-compiles standalone binaries
      # for all 6 targets into packages/cli/command/ via @yao-pkg/pkg (build:bin).
      - name: Build binaries
        run: npm run build --workspace @monorepo/cli

      - name: Upload e-linux-x64
        uses: actions/upload-artifact@v4
        with:
          name: e-linux-x64
          path: packages/cli/command/e-linux-x64
          if-no-files-found: error

      - name: Upload e-linux-arm64
        uses: actions/upload-artifact@v4
        with:
          name: e-linux-arm64
          path: packages/cli/command/e-linux-arm64
          if-no-files-found: error

      - name: Upload e-macos-x64
        uses: actions/upload-artifact@v4
        with:
          name: e-macos-x64
          path: packages/cli/command/e-macos-x64
          if-no-files-found: error

      - name: Upload e-macos-arm64
        uses: actions/upload-artifact@v4
        with:
          name: e-macos-arm64
          path: packages/cli/command/e-macos-arm64
          if-no-files-found: error

      - name: Upload e-win-x64
        uses: actions/upload-artifact@v4
        with:
          name: e-win-x64
          path: packages/cli/command/e-win-x64.exe
          if-no-files-found: error

      - name: Upload e-win-arm64
        uses: actions/upload-artifact@v4
        with:
          name: e-win-arm64
          path: packages/cli/command/e-win-arm64.exe
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/cli/command/*
          fail_on_unmatched_files: true
